<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171917"><title>BITES — Food worth showing up for.</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#181916;--dark:#242822;--orange:#f65a32;--cream:#faf8f2;--line:#e9e6dc;--muted:#817e75;--green:#3d6952}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:'DM Sans',Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}h1,h2,h3,h4,p{margin-top:0}h1,h2,h3{font-family:Outfit,sans-serif;letter-spacing:-.04em}h1{font-size:clamp(45px,6.1vw,91px);line-height:.98}h2{font-size:clamp(27px,3vw,42px)}h3{font-size:23px}a{color:inherit}.shell{max-width:1440px;padding:0 5vw;margin:auto}.topbar{height:78px;background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;gap:20px}.logo{font-family:Outfit;font-size:33px;font-weight:900;letter-spacing:-.08em;white-space:nowrap}.logo span{color:var(--orange)}.nav{display:flex;align-items:center;gap:22px}.nav button{border:0;background:none;font-weight:800;color:var(--ink);font-size:13px}.pill,.cta{border:0;border-radius:99px;background:var(--ink);color:white;padding:14px 22px;font-size:13px;font-weight:800}.cta{background:var(--orange)}.nav .pill{color:white}.counter{display:inline-block;padding:3px 7px;background:var(--orange);border-radius:50px;margin-left:5px}.eyebrow{color:var(--orange);font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:11px}.hero{min-height:470px;border-radius:28px;background:#f7d9c6;display:flex;align-items:center;overflow:hidden;margin:34px 0 65px;position:relative}.hero:before{content:'';position:absolute;width:460px;height:460px;border:2px dashed #cf9d85;border-radius:50%;right:0;top:0}.hero-inner{padding:clamp(30px,5vw,75px);position:relative;z-index:1;max-width:700px}.hero h1{margin:19px 0}.hero p{font-size:17px;color:#675a4c;line-height:1.7;max-width:430px}.hero-food{font-size:clamp(120px,18vw,265px);position:absolute;right:5%;bottom:4%;transform:rotate(-17deg);filter:drop-shadow(20px 30px 13px #b76f5440)}.heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}.muted{color:var(--muted)}.categories{display:flex;gap:9px;overflow:auto;margin:20px 0 29px;padding-bottom:8px}.categories button{border:1px solid var(--line);background:#fff;border-radius:70px;padding:11px 18px;font-weight:800;font-size:13px;white-space:nowrap}.categories button.active{background:var(--ink);color:white}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px;margin-bottom:90px}.card{border:1px solid var(--line);background:white;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}.food-art{height:185px;background:radial-gradient(circle at 49% 45%,#fff8e6,#f6ead8);font-size:101px;display:grid;place-items:center}.card-body{padding:20px;display:flex;flex:1;flex-direction:column}.card-body h3{margin:8px 0;font-size:21px}.card-body p{font-size:13px;line-height:1.6;flex:1}.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px}.price{font-weight:900}.round{width:39px;height:39px;border:0;border-radius:50%;background:var(--orange);color:white;font-size:25px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin:22px 0}.panel h3{margin-bottom:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:25px}.stat strong{display:block;font-family:Outfit;font-size:36px;letter-spacing:-.04em;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.tag{display:inline-block;padding:7px 12px;border-radius:30px;background:#f2efe7;font-weight:900;font-size:10px;letter-spacing:.05em}.tag.DELIVERED,.tag.READY{background:#ddf2e5;color:#27613f}.tag.CANCELLED{background:#fbe3e0;color:#b43c2c}.tag.PLACED{background:#fff0d6;color:#986015}.small{font-size:12px}.btn{border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 16px;font-size:12px;font-weight:800}.btn.dark{background:var(--ink);color:white}.btn.accent{background:var(--orange);color:white;border-color:var(--orange)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:17px}.order{padding:22px;background:white;border:1px solid var(--line);border-radius:18px;margin-bottom:13px}.order h3{margin:0}.detail{font-size:13px;color:#65645f;line-height:1.7}.form{max-width:460px;margin:0 auto;padding:25px 0 85px}.form h2{margin-bottom:7px}.field{display:block;font-size:12px;font-weight:900;margin:17px 0}.field input,.field textarea,.field select{border:1px solid #ddd9cd;border-radius:12px;background:#fff;width:100%;padding:13px 15px;margin-top:7px;color:var(--ink)}.form button.cta{width:100%;margin-top:10px}.auth-links{display:flex;justify-content:center;gap:14px;margin:21px}.auth-links button{border:0;background:none;font-size:13px;font-weight:800;text-decoration:underline}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;background:#292a25;color:#fff;padding:14px 22px;border-radius:14px;box-shadow:0 15px 40px #0003;max-width:min(500px,90vw)}.backdrop{position:fixed;inset:0;background:#0007;display:none;z-index:30}.backdrop.open{display:block}.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:white;transform:translateX(102%);transition:transform .2s ease;z-index:31;display:flex;flex-direction:column;padding:27px;box-shadow:-20px 0 50px #0002}.drawer.open{transform:translateX(0)}.cart-scroll{flex:1;overflow:auto}.cart-line{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:16px 0}.cart-line .emoji{font-size:36px}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid var(--line);background:white;border-radius:20px;width:28px;height:28px}.big-total{font-weight:900;font-size:24px;display:flex;justify-content:space-between;padding:18px 0}.drawer .cta{width:100%}.hint{background:#f2efe7;border-radius:12px;padding:13px;font-size:12px;line-height:1.6}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:14px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;color:var(--muted)}footer{padding:30px 5vw;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px}.hidden{display:none!important}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.hero-food{opacity:.5}.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.topbar{height:66px}.nav{gap:9px}.nav button{font-size:11px}.nav button.pill{padding:10px}.hero{min-height:360px;margin:20px 0 42px}.hero-inner{padding:28px}.hero-food{right:-20px;opacity:.26}.hero h1{letter-spacing:-.065em}.cards,.grid2{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card-body{padding:13px}.food-art{height:125px;font-size:72px}.card-body h3{font-size:18px}.grid4{gap:8px}.stat{padding:15px}.stat strong{font-size:26px}.heading{align-items:start}.panel{padding:16px}}@media(max-width:380px){.cards,.grid2{grid-template-columns:1fr}.nav{gap:4px}}
</style></head><body><header class="topbar"><div class="logo" role="button" tabindex="0" onclick="navigate('home')">bites<span>.</span></div><nav class="nav" id="nav"></nav></header><main class="shell" id="app"></main><footer><span>© BITES · A UNCOMMON DIGITAL experience</span><a href="https://uncommondigital.studio/" target="_blank" rel="noopener noreferrer">uncommondigital.studio ↗</a></footer><div id="backdrop" class="backdrop" onclick="toggleCart(false)"></div><aside class="drawer" id="drawer" aria-label="Shopping cart"><div class="row"><h2>Your bag</h2><button class="btn" onclick="toggleCart(false)">Close ✕</button></div><div id="cartContent" class="cart-scroll"></div><div class="big-total"><span>Total</span><span id="cartTotal">0 MAD</span></div><div id="cartCheckout"></div></aside><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),state={token:sessionStorage.getItem('bitesToken')||'',user:null,page:'home',menu:[],cart:{},category:'All',orders:[],restaurantMenu:[],users:[],stats:null,driverAvailable:[]};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>`${Number(n||0).toFixed(2)} MAD`;
const date=s=>new Date(s).toLocaleString();
let notifyTimer;
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(notifyTimer);notifyTimer=setTimeout(()=>$('toast').classList.add('hidden'),4200)}
async function api(path,options={}){const headers={'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{}),...(options.headers||{})};let res;try{res=await fetch('/api'+path,{...options,headers})}catch{throw Error('Connection failed. Is the server running?')};let data=null;if(res.status!==204){try{data=await res.json()}catch{}}if(!res.ok){if(res.status===401&&state.token){sessionStorage.removeItem('bitesToken');state.token='';state.user=null}throw Error(data?.error||`Request failed (${res.status})`)}return data}
function navigate(page){state.page=page;toggleCart(false);render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){let u=state.user;let links=u?.role==='RESTAURANT'?[['kitchen','Orders'],['inventory','Menu']]:u?.role==='DRIVER'?[['driver','Deliveries']]:u?.role==='ADMIN'?[['admin','Overview']]:[['home','Menu'],...(u?[['orders','My orders']]:[])];$('nav').innerHTML=links.map(([p,t])=>`<button data-page="${p}">${t}</button>`).join('')+(u?`<button data-action="logout" class="pill">Log out</button>`:`<button data-page="login" class="pill">Sign in</button>`)+(u?.role==='CUSTOMER'||!u?`<button class="pill" data-action="cart">Bag <span class="counter" id="navCount">${cartCount()}</span></button>`:'')}
function render(){renderNav();const app=$('app');if(state.page==='login'||state.page==='register'){app.innerHTML=authPage();return}if(['kitchen','inventory','driver','admin','orders'].includes(state.page)&&!state.user){state.page='login';app.innerHTML=authPage();return}switch(state.page){case 'kitchen':app.innerHTML=kitchenPage();break;case 'inventory':app.innerHTML=inventoryPage();break;case 'driver':app.innerHTML=driverPage();break;case 'admin':app.innerHTML=adminPage();break;case 'orders':app.innerHTML=ordersPage();break;default:app.innerHTML=homePage()}renderCart()}
const menuCard=x=>`<article class="card"><div class="food-art">${safe(x.emoji)}</div><div class="card-body"><span class="eyebrow">${safe(x.category)} · ${safe(x.restaurant)}</span><h3>${safe(x.name)}</h3><p class="muted">${safe(x.description)}</p><div class="card-bottom"><span class="price">${money(x.price)}</span><button class="round" data-add="${x.id}" aria-label="Add ${safe(x.name)}">+</button></div></div></article>`;
function homePage(){const cats=['All',...new Set(state.menu.map(x=>x.category))];let items=state.menu.filter(x=>state.category==='All'||x.category===state.category);return `<section class="hero"><div class="hero-inner"><div class="eyebrow">Made fresh. Made happy.</div><h1>Good food.<br>Better mood<span style="color:var(--orange)">.</span></h1><p>Your next favorite bite is just around the corner. Pick what you love. We'll handle the rest.</p><button class="pill" onclick="document.querySelector('#menuSection').scrollIntoView({behavior:'smooth'})">Explore the menu ↗</button></div><div class="hero-food" aria-hidden="true">🍔</div></section><section id="menuSection"><div class="heading"><div><h2>Made for your cravings</h2><p class="muted">Bold flavor, no compromises.</p></div><span class="tag">${state.menu.length} choices</span></div><div class="categories">${cats.map(c=>`<button data-category="${safe(c)}" class="${c===state.category?'active':''}">${safe(c)}</button>`).join('')}</div><div class="cards">${items.map(menuCard).join('')||'<p class="muted">No items available yet.</p>'}</div></section>`}
function authPage(){let register=state.page==='register';return `<section class="form"><div class="eyebrow">Your place at the table</div><h2>${register?'Create your account':'Welcome back'}</h2><p class="muted">${register?'Your next food adventure starts here.':'Log in to order or manage your workspace.'}</p><form id="authForm">${register?'<label class="field">Your name<input name="name" autocomplete="name" required minlength="2" maxlength="100"></label>':''}<label class="field">Email address<input type="email" name="email" autocomplete="email" required></label><label class="field">Password<input type="password" name="password" autocomplete="${register?'new-password':'current-password'}" minlength="${register?10:1}" required></label><button class="cta" type="submit">${register?'Create account →':'Sign in →'}</button></form><div class="auth-links"><button data-page="${register?'login':'register'}">${register?'Already a member? Sign in':'New here? Create an account'}</button></div><div class="hint">Local demo: customer@bites.local · restaurant@bites.local · driver@bites.local · admin@bites.local. Password: BitesDemo2026! (change with DEMO_PASSWORD). Available only when demo seeding is enabled.</div></section>`}
function orderCard(o,buttons=''){return `<article class="order"><div class="row"><h3>Order #${o.id}</h3><span class="tag ${safe(o.status)}">${safe(o.status.replaceAll('_',' '))}</span></div><p class="detail">${date(o.createdAt)} · ${safe(o.restaurant)} · ${money(o.total)}</p><p class="detail"><strong>Customer:</strong> ${safe(o.customer)} · <strong>Driver:</strong> ${safe(o.driver||'Not assigned')}</p><p class="detail"><strong>Address:</strong> ${safe(o.address)}${o.notes?`<br><strong>Notes:</strong> ${safe(o.notes)}`:''}</p><div class="detail">${o.lines.map(l=>`${l.quantity} × ${safe(l.name)} (${money(l.unitPrice)})`).join(' · ')}</div>${buttons?`<div class="actions">${buttons}</div>`:''}</article>`}
const statusButton=(id,status,scope,label)=>`<button class="btn ${status==='CANCELLED'?'':'accent'}" data-status="${status}" data-id="${id}" data-scope="${scope}">${label}</button>`;
function kitchenPage(){return `<section style="padding:45px 0"><div class="eyebrow">Restaurant workspace</div><h2>Kitchen command center</h2><p class="muted">Review incoming orders and move them through preparation.</p><div class="row"><span class="tag">${state.orders.length} orders</span><button class="btn" data-action="refresh">↻ Refresh</button></div><div style="margin-top:25px">${state.orders.map(o=>orderCard(o,o.status==='PLACED'?statusButton(o.id,'ACCEPTED','restaurant','Accept order')+statusButton(o.id,'CANCELLED','restaurant','Cancel'):o.status==='ACCEPTED'?statusButton(o.id,'PREPARING','restaurant','Start preparing')+statusButton(o.id,'CANCELLED','restaurant','Cancel'):o.status==='PREPARING'?statusButton(o.id,'READY','restaurant','Mark ready'):'' )).join('')||'<div class="panel">No orders yet. Customer orders appear here.</div>'}</div></section>`}
function inventoryPage(){return `<section style="padding:45px 0"><div class="eyebrow">Restaurant workspace</div><h2>Menu manager</h2><p class="muted">Create, price and update food offerings.</p><div class="grid2"><div class="panel"><h3>Add menu item</h3><form id="menuForm"><label class="field">Name<input name="name" required maxlength="110"></label><label class="field">Category<input name="category" required maxlength="40" placeholder="Burgers"></label><label class="field">Description<textarea name="description" maxlength="500" required></textarea></label><label class="field">Emoji<input name="emoji" maxlength="10" required value="🍽️"></label><label class="field">Price (MAD)<input name="price" type="number" step="0.01" min="1" required></label><label class="field"><input name="available" type="checkbox" checked style="width:auto"> Available now</label><button class="cta" type="submit">Add to menu</button></form></div><div class="panel"><h3>Current items (${state.restaurantMenu.length})</h3>${state.restaurantMenu.map(x=>`<div class="cart-line"><div class="emoji">${safe(x.emoji)}</div><div style="flex:1"><strong>${safe(x.name)}</strong><div class="detail">${money(x.price)} · ${x.available?'Available':'Hidden'}</div></div><button class="btn" data-toggle-item="${x.id}">${x.available?'Hide':'Show'}</button></div>`).join('')||'<p class="muted">No items added.</p>'}</div></div></section>`}
function driverPage(){return `<section style="padding:45px 0"><div class="eyebrow">Driver workspace</div><h2>Deliver great moments.</h2><p class="muted">Claim ready deliveries and update their status.</p><div class="row"><h3>Available for pickup (${state.driverAvailable.length})</h3><button class="btn" data-action="refresh">↻ Refresh</button></div>${state.driverAvailable.map(o=>orderCard(o,`<button class="btn accent" data-claim="${o.id}">Claim delivery</button>`)).join('')||'<div class="panel">No available deliveries right now.</div>'}<h3 style="margin-top:35px">My deliveries</h3>${state.orders.map(o=>orderCard(o,o.status==='READY'?statusButton(o.id,'PICKED_UP','driver','Picked up'):o.status==='PICKED_UP'?statusButton(o.id,'DELIVERED','driver','Delivered'):'' )).join('')||'<p class="muted">Claim an order to get started.</p>'}</section>`}
function ordersPage(){return `<section style="padding:45px 0"><div class="row"><div><div class="eyebrow">Your bites</div><h2>Order history</h2><p class="muted">Check where your food is, from kitchen to doorstep.</p></div><button class="btn" data-action="refresh">↻ Refresh</button></div>${state.orders.map(o=>orderCard(o)).join('')||'<div class="panel">No orders yet. Explore the menu and place your first order.</div>'}</section>`}
function adminPage(){let s=state.stats||{customers:0,restaurants:0,drivers:0,orders:0,revenueDelivered:0};return `<section style="padding:45px 0"><div class="eyebrow">BITES operations</div><div class="row"><h2>Platform overview</h2><button class="btn" data-action="refresh">↻ Refresh</button></div><div class="grid4"><div class="stat"><span class="muted small">Orders</span><strong>${s.orders}</strong></div><div class="stat"><span class="muted small">Customers</span><strong>${s.customers}</strong></div><div class="stat"><span class="muted small">Restaurants</span><strong>${s.restaurants}</strong></div><div class="stat"><span class="muted small">Delivered value</span><strong style="font-size:24px">${money(s.revenueDelivered)}</strong></div></div><div class="panel"><h3>User directory (${state.users.length})</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>${state.users.map(x=>`<tr><td>${safe(x.name)}</td><td>${safe(x.email)}</td><td>${safe(x.role)}</td></tr>`).join('')}</tbody></table></div></div><h3>All orders</h3>${state.orders.map(o=>orderCard(o)).join('')||'<div class="panel">No orders recorded yet.</div>'}</section>`}
function cartCount(){return Object.values(state.cart).reduce((s,q)=>s+q,0)}
function renderCart(){if(!$('cartContent'))return;let items=Object.entries(state.cart).filter(([id,q])=>q>0).map(([id,q])=>({item:state.menu.find(x=>String(x.id)===String(id)),q,id})).filter(x=>x.item);$('cartContent').innerHTML=items.map(({item:x,q,id})=>`<div class="cart-line"><div class="emoji">${safe(x.emoji)}</div><div style="flex:1"><strong>${safe(x.name)}</strong><div class="detail">${money(x.price)}</div></div><div class="qty"><button data-dec="${id}">−</button>${q}<button data-inc="${id}">+</button></div></div>`).join('')||'<p class="muted">Your bag is empty. Go find something delicious.</p>';$('cartTotal').textContent=money(items.reduce((s,{item,q})=>s+Number(item.price)*q,0));$('cartCheckout').innerHTML=items.length?`<div class="hint">Cash on delivery demo · No online payment or courier is automatically dispatched.</div>${state.user?.role==='CUSTOMER'?'<form id="checkoutForm"><label class="field">Delivery address<textarea required name="address" maxlength="250" placeholder="Street, building, city"></textarea></label><label class="field">Notes (optional)<textarea name="notes" maxlength="500" placeholder="Anything we should know?"></textarea></label><button type="submit" class="cta">Place order →</button></form>':`<button class="cta" data-action="login-to-checkout">${state.user?'Customer account required':'Sign in to checkout'}</button>`}`:'';if($('navCount'))$('navCount').textContent=cartCount()}
function toggleCart(open){$('drawer').classList.toggle('open',open);$('backdrop').classList.toggle('open',open);if(open)renderCart()}
async function loadMenu(){state.menu=await api('/menu');render()}
async function refresh(){if(!state.user){await loadMenu();return}let role=state.user.role;if(role==='CUSTOMER'){state.orders=await api('/orders');await loadMenu()}else if(role==='RESTAURANT'){[state.orders,state.restaurantMenu]=await Promise.all([api('/restaurant/orders'),api('/restaurant/menu')]);render()}else if(role==='DRIVER'){[state.orders,state.driverAvailable]=await Promise.all([api('/driver/orders'),api('/driver/available')]);render()}else if(role==='ADMIN'){[state.orders,state.users,state.stats]=await Promise.all([api('/admin/orders'),api('/admin/users'),api('/admin/stats')]);render()}}
async function signedIn(data){state.token=data.token;state.user=data.user;sessionStorage.setItem('bitesToken',data.token);state.page=({CUSTOMER:'home',RESTAURANT:'kitchen',DRIVER:'driver',ADMIN:'admin'})[state.user.role];await refresh();toast('Welcome, '+state.user.name)}
async function logout(){try{await api('/auth/logout',{method:'POST'})}catch{}sessionStorage.removeItem('bitesToken');state.token='';state.user=null;state.orders=[];state.page='home';render();toast('Signed out')}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;try{if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.category){state.category=b.dataset.category;render();return}if(b.dataset.add){let x=state.menu.find(x=>x.id==b.dataset.add);let existing=Object.keys(state.cart).filter(id=>state.cart[id]>0).map(id=>state.menu.find(m=>m.id==id)).filter(Boolean);if(existing.length&&existing[0].restaurantId!==x.restaurantId){toast('Place an order from one restaurant at a time.');return}state.cart[x.id]=Math.min(20,(state.cart[x.id]||0)+1);toggleCart(true);renderNav();return}if(b.dataset.inc){state.cart[b.dataset.inc]=Math.min(20,(state.cart[b.dataset.inc]||0)+1);renderCart();renderNav();return}if(b.dataset.dec){state.cart[b.dataset.dec]=Math.max(0,(state.cart[b.dataset.dec]||0)-1);renderCart();renderNav();return}if(b.dataset.action==='cart'){toggleCart(true);return}if(b.dataset.action==='login-to-checkout'){navigate('login');return}if(b.dataset.action==='logout'){await logout();return}if(b.dataset.action==='refresh'){await refresh();toast('Up to date');return}if(b.dataset.status){await api(`/${b.dataset.scope}/orders/${b.dataset.id}/status`,{method:'POST',body:JSON.stringify({status:b.dataset.status})});await refresh();toast('Order status updated');return}if(b.dataset.claim){await api(`/driver/orders/${b.dataset.claim}/claim`,{method:'POST'});await refresh();toast('Delivery claimed');return}if(b.dataset.toggleItem){let x=state.restaurantMenu.find(x=>x.id==b.dataset.toggleItem);await api('/restaurant/menu/'+x.id,{method:'PUT',body:JSON.stringify({...x,available:!x.available})});await refresh();toast('Menu updated')}}catch(err){toast(err.message)}});
document.addEventListener('submit',async e=>{e.preventDefault();let form=e.target,btn=form.querySelector('button[type=submit]');if(btn)btn.disabled=true;try{const obj=Object.fromEntries(new FormData(form));if(form.id==='authForm'){const result=await api(state.page==='register'?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify(obj)});await signedIn(result)}else if(form.id==='checkoutForm'){let result=await api('/orders',{method:'POST',body:JSON.stringify({address:obj.address,notes:obj.notes||'',items:Object.entries(state.cart).filter(([id,q])=>q>0).map(([id,q])=>({menuItemId:Number(id),quantity:q}))})});state.cart={};await refresh();navigate('orders');toast('Order #'+result.id+' placed! Pay on delivery (demo).')}else if(form.id==='menuForm'){await api('/restaurant/menu',{method:'POST',body:JSON.stringify({...obj,available:!!form.elements.available.checked})});await refresh();toast('Menu item added')}}catch(err){toast(err.message)}finally{if(btn&&btn.isConnected)btn.disabled=false}});
(async function init(){try{state.menu=await api('/menu');if(state.token){try{state.user=await api('/auth/me');state.page=({CUSTOMER:'home',RESTAURANT:'kitchen',DRIVER:'driver',ADMIN:'admin'})[state.user.role];await refresh()}catch{sessionStorage.removeItem('bitesToken');state.token='';state.user=null}}render();setInterval(async()=>{if(!state.user||document.hidden)return;try{await refresh()}catch{}},12000)}catch(err){$('app').innerHTML='<div class="panel">Unable to load the menu. Check that the backend and database are running, then reload.</div>'}})();
</script></body></html>
